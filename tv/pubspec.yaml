name: viulivetv
description: "Viu Live TV for Android TV — leanback live-TV client for Viu (api.viu.rs) subscribers: YouTube-TV-style rows, Material 3 Expressive, dark mode only, full remote support and Google Assistant voice actions. Unofficial, personal-use client."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
