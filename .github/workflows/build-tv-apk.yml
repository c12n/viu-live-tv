name: Build TV APK (Flutter)

on:
  push:
    branches: [ main ]
    paths:
      - 'tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install Pillow (icon/banner generation)
        run: python3 -m pip install --quiet pillow

      - name: Assemble platform scaffolding and Android TV overlay
        run: bash tv/tool/setup_platforms.sh

      - name: Build release APK
        working-directory: tv
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViuLiveTV-TV-APK
          path: tv/build/app/outputs/flutter-apk/app-release.apk
