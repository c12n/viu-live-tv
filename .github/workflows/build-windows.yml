name: Build Windows x64 (Flutter)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Assemble Windows scaffold (flutter create + overlay)
        working-directory: mobile
        shell: bash
        run: bash tool/setup_windows.sh

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release (Windows x64)
        working-directory: mobile
        run: flutter build windows --release

      - name: Package release folder
        working-directory: mobile
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ViuLiveTV-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ViuLiveTV-Windows
          path: mobile/ViuLiveTV-Windows-x64.zip
          if-no-files-found: error
